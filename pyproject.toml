[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-picker"
version = "0.1.0"
description = "Browse local media and launch mpv with optional external audio and subtitle tracks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.11.2",
]

[project.scripts]
media-picker = "media_picker:main"

[project.urls]
Homepage = "https://github.com/IngvarListard/media-picker"
Repository = "https://github.com/IngvarListard/media-picker"

[tool.setuptools]
py-modules = ["media_picker", "files"]
